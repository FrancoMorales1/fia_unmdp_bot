packages:
  - 'apps/*'
  - 'packages/*'

# Catálogo central de versiones: un solo lugar donde bumpear.
# Los packages referencian con "catalog:".
catalog:
  # --- runtime ---
  '@google/genai': ^2.17.1
  grammy: ^1.45.1
  '@hapi/boom': ^10.0.1
  baileys: ^7.0.0-rc14
  bullmq: ^6.1.2
  cheerio: ^1.2.0
  dotenv: ^17.4.2
  drizzle-orm: ^0.45.2
  ioredis: ^6.0.0
  next: ^16.3.2
  pg: ^8.23.0
  pino: ^10.3.1
  pino-pretty: ^13.1.2
  qrcode-terminal: ^0.12.0
  react: ^19.2.0
  react-dom: ^19.2.0
  zod: ^4.4.3

  # --- tooling ---
  '@eslint/js': ^10.0.1
  '@types/node': ^26.2.0
  '@types/pg': ^8.21.0
  '@types/qrcode-terminal': ^0.12.2
  '@types/react': ^19.2.18
  '@types/react-dom': ^19.2.4
  '@vitest/coverage-v8': ^4.1.10
  drizzle-kit: ^0.31.10
  esbuild: ^0.28.2
  eslint: ^10.8.1
  eslint-config-prettier: ^10.1.8
  eslint-import-resolver-typescript: ^4.4.5
  eslint-plugin-import-x: ^4.17.1
  globals: ^17.11.0
  prettier: ^3.9.6
  rimraf: ^6.1.3
  tsx: ^4.23.12
  typescript: ~5.9.3
  typescript-eslint: ^8.67.0
  vitest: ^4.1.10

# pnpm 10 bloquea los scripts de instalación por defecto.
# Solo estas dependencias tienen permitido ejecutar postinstall.
onlyBuiltDependencies:
  - esbuild

# Evita que un package use algo que no declaró en su package.json.
nodeLinker: isolated

# drizzle-kit no declara drizzle-orm/pg y en el linker aislado no los ve.
# En pnpm 11 esto va acá, no en package.json#pnpm.
packageExtensions:
  drizzle-kit:
    peerDependencies:
      drizzle-orm: '*'
      pg: '*'
