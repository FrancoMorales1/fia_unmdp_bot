name: fi-bot

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fi
      POSTGRES_PASSWORD: fi
      POSTGRES_DB: fi_bot
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fi -d fi_bot']
      interval: 10s
      timeout: 5s
      retries: 5

  db-seed:
    image: node:24-bookworm-slim
    working_dir: /workspace
    environment:
      DATABASE_URL: postgres://fi:fi@postgres:5432/fi_bot
      CI: 'true'
    volumes:
      - .:/workspace
    depends_on:
      postgres:
        condition: service_healthy
    command: >-
      sh -c "corepack enable && pnpm install --frozen-lockfile && pnpm db:migrate &&
      pnpm db:seed-planes"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  bot:
    build:
      context: .
      dockerfile: apps/bot/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      # Adentro de la red de compose se habla por nombre de servicio, no por
      # localhost ni por el puerto remapeado del host (p. ej. 6380).
      DATABASE_URL: postgres://fi:fi@postgres:5432/fi_bot
      REDIS_URL: redis://redis:6379
    volumes:
      # `material/` no viaja en la imagen (el Dockerfile solo empaqueta
      # packages/apps): sin este mount, calendario/planes/facultad/ingreso
      # fallan con ENOENT.
      - ./material:/app/material:ro
      # Sesión de WhatsApp (Baileys): sin este volumen, cada `docker compose
      # up --build` pide escanear el QR de nuevo.
      - ./.auth:/app/.auth
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-seed:
        condition: service_completed_successfully

volumes:
  postgres-data:
  redis-data:
